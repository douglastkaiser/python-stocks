name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Test
        env:
          PYTHON_STOCKS_TEST_MODE: "1"
        run: make test

  artifacts:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Generate simulation and Plotly artifacts
        env:
          PYTHON_STOCKS_TEST_MODE: "1"
        run: make artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simulation-and-plotly-assets
          path: artifacts
          if-no-files-found: error

  web:
    name: Interactive workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run format:check --prefix web
      - run: python scripts/export_web_data.py
      - run: npm test --prefix web
      - run: PYTHONPATH=. python scripts/build_dashboard_preview.py build/site
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:browser --prefix web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: web/test-results
